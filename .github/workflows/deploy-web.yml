name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # بدون المفتاحين يُبنى التطبيق في الوضع التجريبي بلا مزامنة، وينشر فوق
      # الموقع الحيّ نسخة لا تسجّل دخولاً. نفشل بدل ذلك.
      - name: Require Supabase secrets
        run: |
          [ -n "$URL" ] && [ -n "$KEY" ] || { echo "::error::Add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY under Settings > Secrets > Actions"; exit 1; }
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # المفتاحان عامّان بطبيعتهما (anon key محمي بـ RLS) لكنهما يُحقنان وقت
      # البناء. أضفهما في: Settings → Secrets and variables → Actions.
      - name: Export web bundle
        run: npm run export:web
        env:
          EXPO_BASE_URL: /nuqoot-tracker
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Pages لا يعرف مسارات التطبيق: أي رابط غير الجذر يعطي 404، فنقدّم
      # الصفحة نفسها. و.nojekyll يمنع تجاهل المجلد _expo.
      - name: Prepare for Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
